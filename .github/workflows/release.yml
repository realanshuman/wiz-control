# Builds the downloadable bridge for every platform and attaches it to a GitHub Release.
# Runs when a tag like v1.2.3 is pushed (or manually from the Actions tab).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx pkg . --targets node22-macos-arm64 --output dist/wiz-bridge-arm64
      - run: npx pkg . --targets node22-macos-x64 --output dist/wiz-bridge-x64
      - run: bash scripts/build-mac-app.sh dist/wiz-bridge-arm64 AppleSilicon
      - run: bash scripts/build-mac-app.sh dist/wiz-bridge-x64 Intel
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/*.zip, if-no-files-found: error }

  win-linux:
    name: Windows and Linux builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx pkg . --targets node22-win-x64 --output dist/WiZ-Bridge-Windows.exe
      - run: npx pkg . --targets node22-linux-x64 --output dist/wiz-bridge
      - run: tar -czf dist/wiz-bridge-linux-x64.tar.gz -C dist wiz-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: win-linux
          if-no-files-found: error
          path: |
            dist/WiZ-Bridge-Windows.exe
            dist/wiz-bridge-linux-x64.tar.gz

  release:
    name: Publish release
    needs: [mac, win-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            | --- | --- |
            | Mac with Apple silicon (M1–M4) | `WiZ-Bridge-macOS-AppleSilicon.zip` |
            | Mac with Intel | `WiZ-Bridge-macOS-Intel.zip` |
            | Windows 10/11 (64-bit) | `WiZ-Bridge-Windows.exe` |
            | Linux (64-bit) | `wiz-bridge-linux-x64.tar.gz` |

            Open the bridge, then use the web app. On a Mac the first launch needs **System Settings → Privacy & Security → Open Anyway** once, because the app isn't notarized. On Windows, choose **More info → Run anyway** if SmartScreen appears.
